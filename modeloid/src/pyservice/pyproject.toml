# Python side of Modeloid: training and inference with Ultralytics / PyTorch.
#
# Not installed by hand: Modeloid's "Python environment" setup (Settings →
# Python environment) runs uv with this project, putting the venv in
# modeloid/.venv and a uv-managed Python in modeloid/python.
#
# Ultralytics, Optuna and Albumentations are always installed. PyTorch comes in two builds,
# chosen by extra: `cpu` (the default) or `cu130` (NVIDIA GPU, CUDA 13.0).
# Exactly one is installed; switching builds only swaps torch and torchvision.
#
# Development:
#   UV_PROJECT_ENVIRONMENT=../../.venv uv sync --extra cu130   (or --extra cpu)

[project]
name = "modeloid-pyservice"
version = "0.1.0"
description = "Training and inference service for Modeloid"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics>=8.3",
    "optuna>=4.2",
    "albumentations>=2.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.7",
    "torchvision>=0.22",
]
cu130 = [
    "torch>=2.7",
    "torchvision>=0.22",
]

[tool.uv]
package = false
# Albumentations asks for opencv-python-headless; Ultralytics brings
# opencv-python. Both install the same cv2 module, so only one is kept:
# the headless one, which leaves out the GUI (Qt on Linux) Modeloid never uses.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
