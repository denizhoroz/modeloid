# Python side of Modeloid: training and inference with Ultralytics / PyTorch.
#
# Not installed by hand: Modeloid's "Python environment" setup (Settings →
# Python environment) runs uv with this project, putting the venv in
# modeloid/.venv and a uv-managed Python in modeloid/python.
#
# PyTorch comes in two builds, chosen by extra: `cpu` or `cu130` (NVIDIA GPU,
# CUDA 13.0). Exactly one is installed.
#
# Development:
#   UV_PROJECT_ENVIRONMENT=../../.venv uv sync --extra cu130   (or --extra cpu)

[project]
name = "modeloid-pyservice"
version = "0.1.0"
description = "Training and inference service for Modeloid"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics>=8.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.7",
    "torchvision>=0.22",
]
cu130 = [
    "torch>=2.7",
    "torchvision>=0.22",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
