[package]
name = "modeloid"
version = "0.1.0"
edition = "2024"

[dependencies]
modeloid-types = { path = "../modeloid-types" }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7"
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "tiff"] }
imagesize = "0.15.0"
# 0.12 with rustls/ring, the same as dioxus-fullstack, so the app links one HTTP stack
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync", "time"] }
toml = "1.1.6"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Memory of this computer, for the jobs-at-once limit (see core/limits.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Unpacking uv's .tar.gz download (Windows gets a zip)
[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"
