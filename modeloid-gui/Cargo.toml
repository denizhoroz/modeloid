[package]
name = "modeloid-gui"
version = "0.1.0"
authors = ["denizhoroz <denizhoroz.ofcl@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0.229", features = ["derive"] }
# Shared with the core, builds for the browser too
modeloid-types = { path = "../modeloid-types" }

# Server only: the server runs on the user's machine, so it can use the filesystem and native dialogs
modeloid = { path = "../modeloid", optional = true }
rfd = { version = "0.17.2", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros", "fs", "io-util"], optional = true }
# Reads uploaded files as streams (see api/edit.rs)
futures-util = { version = "0.3", optional = true }
# Brings native dialogs to the front (see api/dialogs.rs)
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Keeps the main thread's event queue drained after a dialog (see main_thread.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSDate",
    "NSObjCRuntime",
    "NSRunLoop",
    "NSString",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:modeloid", "dep:rfd", "dep:tokio", "dep:futures-util", "dep:raw-window-handle", "dep:windows-sys", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
