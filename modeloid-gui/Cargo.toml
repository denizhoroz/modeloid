[package]
name = "modeloid-gui"
version = "0.1.0"
authors = ["denizhoroz <denizhoroz.ofcl@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0.229", features = ["derive"] }

# Server only: the server runs on the user's machine, so it can use the filesystem and native dialogs
modeloid = { path = "../modeloid", optional = true }
rfd = { version = "0.17.2", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
toml = { version = "1.1.6", optional = true }
dirs = { version = "7.0.0", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:modeloid", "dep:rfd", "dep:tokio", "dep:toml", "dep:dirs"]
