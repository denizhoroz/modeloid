# Builds Modeloid for Windows, Linux and macOS and puts the files on a draft
# GitHub Release. Runs when a version tag is pushed (git tag v0.2.0 && git push
# origin v0.2.0), or by hand from the Actions tab (files only, no release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          # Older glibc, so the binary runs on more distributions
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: macos-latest, platform: macos-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libdbus-1-dev librsvg2-bin

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install librsvg

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package
        run: bash installer/package.sh ${{ matrix.platform }}

      # Starts the packaged server and checks it answers (Linux only: no
      # console / Terminal window needed there).
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          dir=$(find dist -maxdepth 1 -type d -name 'Modeloid-*-linux-x64' | head -n1)
          PORT=8099 "$dir/modeloid" > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -sf -H "Host: 127.0.0.1:8099" http://127.0.0.1:8099/api/instance; then
              echo " <- server answered"; kill $pid; exit 0
            fi
            sleep 1
          done
          cat server.log; kill $pid || true; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Modeloid ${{ github.ref_name }}
          files: files/*
