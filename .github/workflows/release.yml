# Builds Modeloid for Windows and puts the files on a draft GitHub Release.
# Linux and macOS aren't released: people build those themselves with
# installer/package.sh (see the README). Runs when a version tag is pushed
# (git tag v0.2.0 && git push origin v0.2.0), or by hand from the Actions tab
# (files only, no release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally: newer releases (LLVM 23) strip the
      # wasm metadata wasm-bindgen needs. Update together with the local toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          # libLLVM for rust-objcopy, which dx uses to strip the server binary
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ env.RUST_VERSION }}

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package
        run: bash installer/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Modeloid ${{ github.ref_name }}
          files: files/*
